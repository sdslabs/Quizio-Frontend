<VirtualHost *:80>
   ServerName q.sdslabs.local
    ProxyRequests off
    ProxyPreserveHost On
    ProxyPass / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/
# This is needed only if you want to use web sockets
   DocumentRoot /home/bb/Documents/SDSLabs/Quizio/public
   <Directory /home/bb/Documents/SDSLabs/Quizio/public>
	Options -Indexes -MultiViews
	Allowoverride all
	Require all granted

	RewriteEngine On
	RewriteCond %{REQUEST_URI}  ^/socket.io            [NC]
   </Directory>
   ErrorLog ${APACHE_LOG_DIR}/quizserve.error.log
   LogLevel warn
   CustomLog ${APACHE_LOG_DIR}/quizserve.access.log combined
</VirtualHost>
